<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="titulo descripcion" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titulo">Logo de Rueda Libre</title>
  <desc id="descripcion">Rueda de bicicleta con líneas de velocidad junto al nombre Rueda Libre, alquiler de bicicletas en Medellín.</desc>

  <defs>
    <line id="radio" x1="120" y1="88" x2="120" y2="46" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  </defs>

  <!-- Líneas de velocidad -->
  <g stroke="#F97316" stroke-width="7" stroke-linecap="round">
    <line x1="12" y1="78" x2="38" y2="78"/>
    <line x1="4" y1="100" x2="34" y2="100"/>
    <line x1="12" y1="122" x2="38" y2="122"/>
  </g>

  <!-- Rueda -->
  <circle cx="120" cy="100" r="62" fill="none" stroke="#0F766E" stroke-width="10"/>
  <g>
    <use href="#radio"/>
    <use href="#radio" transform="rotate(30 120 100)"/>
    <use href="#radio" transform="rotate(60 120 100)"/>
    <use href="#radio" transform="rotate(90 120 100)"/>
    <use href="#radio" transform="rotate(120 120 100)"/>
    <use href="#radio" transform="rotate(150 120 100)"/>
    <use href="#radio" transform="rotate(180 120 100)"/>
    <use href="#radio" transform="rotate(210 120 100)"/>
    <use href="#radio" transform="rotate(240 120 100)"/>
    <use href="#radio" transform="rotate(270 120 100)"/>
    <use href="#radio" transform="rotate(300 120 100)"/>
    <use href="#radio" transform="rotate(330 120 100)"/>
  </g>
  <circle cx="120" cy="100" r="13" fill="#F97316"/>
  <circle cx="120" cy="100" r="5" fill="#ffffff"/>

  <!-- Nombre -->
  <text x="218" y="108" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800">
    <tspan fill="#0F2E2B">Rueda </tspan><tspan fill="#F97316">Libre</tspan>
  </text>

  <!-- Eslogan -->
  <text x="220" y="142" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#0F766E">ALQUILER DE BICICLETAS · MEDELLÍN</text>
</svg>
