
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rueda Nocturna | Rueda Libre</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <main class="flex min-h-screen flex-col items-center justify-center p-6">

        <section class="w-full max-w-5xl space-y-8 text-center">

            <p class="text-sm font-bold uppercase tracking-widest text-emerald-400">
                Nuevo · Jueves a sábado
            </p>

            <h1 class="text-5xl font-extrabold leading-tight tracking-tight text-orange-500 md:text-7xl">
                Rueda Nocturna
            </h1>

            <p class="mx-auto max-w-2xl text-xl leading-relaxed text-slate-300 md:text-2xl">
                Descubre Medellín en bici cuando se encienden las luces
            </p>

            <div class="flex flex-wrap justify-center gap-4">

                <div class="w-full max-w-xs rounded-xl bg-slate-900 p-6">
                    <p class="text-3xl font-bold text-emerald-400">
                        3 rutas
                    </p>
                </div>

                <div class="w-full max-w-xs rounded-xl bg-slate-900 p-6">
                    <p class="text-3xl font-bold text-orange-400">
                        Desde $55.000
                    </p>
                </div>

            </div>

            <a href="#inscripcion"
               class="inline-block rounded-full bg-orange-500 px-8 py-4 text-lg font-bold text-white shadow-lg hover:bg-orange-600 focus:outline-none focus:ring-4 focus:ring-orange-300 focus:ring-offset-2 focus:ring-offset-slate-950">
                Inscríbete →
            </a>

        </section>

        <!-- KIT DE BOTONES -->

        <section class="mt-24 w-full max-w-4xl space-y-8">

            <h2 class="text-center text-3xl font-bold">
                Kit de botones
            </h2>

            <div class="flex flex-wrap items-center justify-center gap-6">

                <!-- Botón principal -->
                <a href="#inscripcion"
                   class="rounded-lg bg-orange-500 px-6 py-3 font-bold text-white shadow-lg transition hover:bg-orange-600 focus:outline-none focus:ring-4 focus:ring-orange-300 focus:ring-offset-2 focus:ring-offset-slate-950">
                    Principal
                </a>

                <!-- Botón secundario -->
                <a href="#rutas"
                   class="rounded-lg bg-emerald-600 px-6 py-3 font-bold text-white shadow-lg transition hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-300 focus:ring-offset-2 focus:ring-offset-slate-950">
                    Secundario
                </a>

                <!-- Botón de contorno -->
                <a href="#informacion"
                   class="rounded-lg border-2 border-orange-400 px-6 py-3 font-bold text-orange-400 transition hover:bg-orange-500 hover:text-white focus:outline-none focus:ring-4 focus:ring-orange-300 focus:ring-offset-2 focus:ring-offset-slate-950">
                    Contorno
                </a>

            </div>

        </section>

    </main>

</body>
</html>
